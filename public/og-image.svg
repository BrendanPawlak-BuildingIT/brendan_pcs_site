<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glowA" cx="16%" cy="6%" r="58%">
      <stop offset="0%" stop-color="#8B7BFF" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#8B7BFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="92%" cy="4%" r="50%">
      <stop offset="0%" stop-color="#46E6C8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#46E6C8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7BFF" />
      <stop offset="100%" stop-color="#46E6C8" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#F2F4F8" stroke-opacity="0.05" stroke-width="1" />
