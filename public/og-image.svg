  <text x="196" y="528" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" font-size="26" fill="#8B7BFF">@brendan_pcs</text>
