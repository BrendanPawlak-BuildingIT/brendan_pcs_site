  </defs>

  <rect width="1200" height="630" fill="#0B0D10" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glowA)" />
  <rect width="1200" height="630" fill="url(#glowB)" />

  <rect x="80" y="76" width="52" height="52" rx="14" fill="url(#wordmark)" />
  <text x="106" y="103" text-anchor="middle" dominant-baseline="central" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" font-size="28" fill="#0B0D10">B</text>
  <text x="150" y="103" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#F2F4F8">Brendan<tspan fill="#8B7BFF">Pcs</tspan></text>

  <text x="80" y="290" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="74" fill="#F2F4F8">PC builds, hardware,</text>
  <text x="80" y="378" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="74" fill="url(#wordmark)">and homelab notes.</text>

  <text x="80" y="448" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="26" fill="#F2F4F8" fill-opacity="0.6">The long version of the videos — part lists, thermals, and the benchmarks that went sideways.</text>

